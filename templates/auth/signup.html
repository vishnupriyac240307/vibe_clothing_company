<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Garment Manufacturing ERP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .auth-card {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            padding: 2.25rem;
        }
        .brand-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #2563eb, #8b5cf6);
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="brand-icon mx-auto"><i class="fa-solid fa-shirt"></i></div>
            <h4 class="fw-bold text-dark mb-1">Create ERP Account</h4>
            <p class="text-muted small">Real-Time Production & Inventory Management System</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show mb-3 py-2 small" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('auth.signup') }}" method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold small text-dark">User Role</label>
                <select name="role" class="form-select bg-light" required>
                    <option value="Supervisor">Supervisor (Production, Inventory, QC & Logistics)</option>
                    <option value="Admin">Admin (Full System & User Management Access)</option>
                </select>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold small text-dark">Username</label>
                    <input type="text" name="username" class="form-control bg-light" placeholder="e.g. john_supervisor" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold small text-dark">Phone Number</label>
                    <input type="text" name="phone" class="form-control bg-light" placeholder="+91 9876543210">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold small text-dark">Email Address</label>
                <input type="email" name="email" class="form-control bg-light" placeholder="john@garmenterp.com" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold small text-dark">Password</label>
                    <input type="password" name="password" class="form-control bg-light" placeholder="Min 6 characters" required>
                </div>
                <div class="col-md-6 mb-4">
                    <label class="form-label fw-semibold small text-dark">Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control bg-light" placeholder="Re-enter password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm" style="background-color: #2563eb; border: none; border-radius: 8px;">
                Register Account <i class="fa-solid fa-user-plus ms-1"></i>
            </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center">
            <p class="small text-muted mb-0">Already registered? <a href="{{ url_for('auth.login') }}" class="fw-semibold text-primary text-decoration-none">Sign In</a></p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
