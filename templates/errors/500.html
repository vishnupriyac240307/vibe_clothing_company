{% extends "base.html" %}
{% block title %}500 Server Error{% endblock %}

{% block content %}
<div class="text-center py-5">
    <i class="fa-solid fa-bug text-danger display-1 mb-3"></i>
    <h1 class="fw-bold text-dark mb-2">500 — Internal Server Error</h1>
    <p class="text-muted lead mb-4">An unexpected system error occurred. The operation has been safely rolled back in the database.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary shadow-sm"><i class="fa-solid fa-house me-2"></i>Return to Dashboard</a>
</div>
{% endblock %}
